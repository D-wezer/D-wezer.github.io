<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Derek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="world"></div>
  </div>

  <!-- Only shown when the page is opened with ?edit -->
  <div id="toolbar" hidden>
    <span class="group">
      <button data-add="text">+ Text</button>
      <button data-add="rect">+ Box</button>
      <button data-add="ellipse">+ Oval</button>
      <button data-add="arrow">+ Arrow</button>
      <button data-add="paper">+ Paper</button>
    </span>
    <span class="group">
      <button id="smaller" title="Smaller text">A−</button>
      <button id="bigger" title="Bigger text">A+</button>
      <button id="delete" title="Delete selected (Del)">Delete</button>
    </span>
    <span class="group">
      <button id="setHome" title="Visitors start at the current view">Set start view</button>
      <button id="export" class="primary">Download content.json</button>
      <button id="import">Import</button>
      <button id="discard" title="Throw away the draft in this browser">Discard draft</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </span>
  </div>

  <div id="hint"></div>

  <script src="app.js"></script>
</body>
</html>
